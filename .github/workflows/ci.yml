name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Self-test suite (parsers, engine, scout, wallets, DeFi math)
        run: PYTHONPATH=src python -m trader selftest
      - name: pytest wrapper
        run: pip install pytest && PYTHONPATH=src pytest -q tests
